# The CheesyBeez cloud copy (SCRUM-61). Deploy from this folder: npm run deploy
name = "cheesybeez-cloud"
main = "src/worker.ts"
compatibility_date = "2025-06-01"
workers_dev = true # the first address; shops installed before the domain still use it
# The shop's own address (DNS on Cloudflare; the record and HTTPS are made on deploy).
routes = [{ pattern = "owner.cheesybeez.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "cheesybeez-cloud"
database_id = "02b0e2d7-482a-4039-8f74-009ed4209045"
migrations_dir = "migrations"

# The owner's phone page (the cloud build of the app; nothing else of the POS is served here).
[assets]
directory = "../dist-cloud"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/owner.webmanifest", "/questions", "/get", "/download"]
