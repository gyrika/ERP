# Releases CheesyBeez on every merge to main that changes what the shop installs:
#   tests (Linux) -> cloud staging -> cloud live ┐
#   tests (Windows)                              ├-> GitHub Release with Setup.exe (next version, e.g. 1.0.4 -> 1.0.5;
#   Setup.exe build                              ┘   a big change: raise deploy/station/release-line.txt)
# The three run side by side; only the release waits, so no Setup.exe is published before the cloud is live
# and the Windows tests pass. A merge whose Setup.exe would install exactly what the last release installs
# (deploy/station/content-hash.mjs) deploys the cloud and releases nothing.
# Shop PCs look every 5 minutes, download it, and install it the next time the PC starts, or late at night when the counter is quiet.
# - A pull request touching the Station, the server, the app or the cloud: built and tested on Windows
#   (and the Setup.exe is downloadable from the run's page), nothing released.
# - Actions tab > Run workflow: a test build, nothing released.
# The cloud steps need two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: CheesyBeez Station

on:
  push:
    branches: [main]
    paths: ['deploy/station/**', '.github/workflows/station.yml', 'server/**', 'src/**', 'cloud/**', 'public/**', 'index.html', 'order.html', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['deploy/station/**', '.github/workflows/station.yml', 'server/**', 'src/**', 'cloud/**', 'public/**', 'index.html', 'order.html', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in the order they were merged.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  # The cloud is live before any release: an older cloud refuses event types it does not know, which
  # would stop the shops' copy (docs/cloud.md). Staging, checked, then live.
  cloud:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install
        run: |
          npm ci
          npm ci --prefix cloud

      - name: Test
        run: npm test

      - name: Cloud staging
        run: |
          npm run migrate:staging --prefix cloud
          npm run deploy:staging --prefix cloud
          curl -fsS --retry 5 --retry-delay 3 https://cheesybeez-cloud-staging.cheesybeez-cloud.workers.dev/api/v1/health

      - name: Cloud live
        run: |
          npm run migrate --prefix cloud
          npm run deploy --prefix cloud
          curl -fsS --retry 5 --retry-delay 3 https://cheesybeez-cloud.cheesybeez-cloud.workers.dev/api/v1/health

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install
        run: npm ci

      - name: Test (on Windows)
        run: npm test

  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      changed: ${{ steps.content.outputs.changed }}
      hash: ${{ steps.content.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the next version number

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Version
        id: version
        shell: pwsh
        run: |
          # A merge to main: the newest v* tag, one more (1.0.9 -> 1.0.10). A big change raises the
          # release line in deploy/station/release-line.txt (1.0 -> 1.1): the next merge is 1.1.0.
          # Anything else: a test number.
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $last = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
            $p = [version]($last.TrimStart('v'))
            $line = [version]("$((Get-Content deploy/station/release-line.txt -Raw).Trim()).0")
            if ($line -gt [version]"$($p.Major).$($p.Minor).0") { $v = "$($line.Major).$($line.Minor).0" }
            else { $v = "$($p.Major).$($p.Minor).$($p.Build + 1)" }
          } else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Node.js for Windows (cached)
        uses: actions/cache@v4
        with:
          path: C:\cb-cache
          key: station-node-22.23.3

      - name: Stage
        shell: pwsh
        run: ./deploy/station/stage.ps1 -NodeVersion 22.23.3 -AppVersion ${{ steps.version.outputs.value }} -Cache C:\cb-cache

      - name: Anything new for the shop?
        id: content
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The last release keeps its content hash in its notes. No release yet, or none with a hash: changed.
          $hash = (node deploy/station/content-hash.mjs).Trim()
          if ($LASTEXITCODE -or $hash -notmatch '^[0-9a-f]{64}$') { throw "content-hash failed: $hash" }
          $last = gh release view --json body,tagName 2>$null | ConvertFrom-Json
          $global:LASTEXITCODE = 0  # no release yet is fine
          $tag = if ($last) { $last.tagName } else { 'no release' }
          $m = [regex]::Match("$($last.body)", '<!-- content: ([0-9a-f]{64}) -->')
          $changed = -not ($m.Success -and $m.Groups[1].Value -eq $hash)
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($changed) { "Setup.exe content changed since ${tag}: a merge releases ${{ steps.version.outputs.value }}." >> $env:GITHUB_STEP_SUMMARY }
          else { "Setup.exe would install exactly what ${tag} installs: a merge deploys the cloud and releases nothing." >> $env:GITHUB_STEP_SUMMARY }
          "content $hash" | Write-Host

      - name: The nightly backup works with the Node.js inside Setup.exe
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'cb-data'
          New-Item -ItemType Directory -Force $data | Out-Null
          $node = 'deploy/station/stage/node/node.exe'
          & $node -e "const { DatabaseSync } = require('node:sqlite'); const d = new DatabaseSync(process.argv[1]); d.exec('PRAGMA journal_mode = WAL; CREATE TABLE events (id TEXT); INSERT INTO events VALUES (1), (2)');" (Join-Path $data 'pos.sqlite')
          & $node --experimental-strip-types --no-warnings deploy/station/stage/app/server/sqliteBackup.ts $data nightly
          if ($LASTEXITCODE) { throw "The backup failed ($LASTEXITCODE)" }
          if (-not (Get-ChildItem (Join-Path $data 'backups') -Filter 'pos-*-nightly.sqlite')) { throw 'No backup file' }

      - name: Build the counter app (CheesyBeez POS.exe)
        if: steps.content.outputs.changed == 'true' || github.event_name != 'push'
        run: dotnet build deploy/station/pos-app/CheesyBeezPOS.csproj -c Release -o deploy/station/stage/pos-app

      - name: Check the counter app has everything it needs
        if: steps.content.outputs.changed == 'true' || github.event_name != 'push'
        shell: pwsh
        run: |
          Get-ChildItem deploy/station/stage/pos-app -Recurse -File | ForEach-Object { $_.FullName.Replace((Resolve-Path deploy/station/stage/pos-app).Path, '') }
          foreach ($need in 'CheesyBeezPOS.exe', 'Microsoft.Web.WebView2.Core.dll', 'Microsoft.Web.WebView2.WinForms.dll', 'WebView2Loader.dll') {
            if (-not (Get-ChildItem deploy/station/stage/pos-app -Recurse -Filter $need)) { throw "The counter app is missing $need" }
          }

      - name: Build Setup.exe
        if: steps.content.outputs.changed == 'true' || github.event_name != 'push'
        shell: pwsh
        run: |
          # The Windows runners come with Inno Setup; install it only if an image ever drops it.
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.value }}" deploy\station\CheesyBeez.iss
          if ($LASTEXITCODE) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem deploy\station\Output

      - uses: actions/upload-artifact@v4
        if: steps.content.outputs.changed == 'true' || github.event_name != 'push'
        with:
          name: CheesyBeez-Setup-${{ steps.version.outputs.value }}
          path: deploy/station/Output/*.exe

  # Only now, with the cloud live, the Windows tests green and something new to install.
  release:
    needs: [cloud, test-windows, build]
    if: github.event_name == 'push' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CheesyBeez-Setup-${{ needs.build.outputs.version }}
          path: out

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*.exe
          # GitHub adds the merged pull requests since the last release under this text.
          generate_release_notes: true
          body: |
            CheesyBeez Station ${{ needs.build.outputs.version }}: download **CheesyBeez-Setup-${{ needs.build.outputs.version }}.exe** and double-click it.
            Windows may say "Windows protected your PC" the first time: click **More info**, then **Run anyway**.
            Shop PCs that already have CheesyBeez download it within minutes and install it the next time the PC starts, or late at night when the counter is quiet.
            <!-- content: ${{ needs.build.outputs.hash }} -->
